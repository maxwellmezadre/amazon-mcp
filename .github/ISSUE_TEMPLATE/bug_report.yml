name: Bug
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Nunca cole `session.enc`, `session.key`, `cache.db`, o diretório
        `browser-profile/`, um header `Cookie` nem números de pedido reais.**
        Eles são a sua conta.
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu
      description: E o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Como reproduzir
      placeholder: |
        1. amazon sync
        2. amazon orders --from 2025-01-01
        3. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Saída de `amazon doctor`
      description: Ela diz qual camada quebrou. Censure números de pedido e nomes.
      render: text
  - type: input
    id: version
    attributes:
      label: Versão
      placeholder: amazon --version
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Sistema, Bun e navegador
      placeholder: macOS 15 / Bun 1.3.14 / Chrome 140
